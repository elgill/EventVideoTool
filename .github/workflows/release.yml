# Builds signed Windows installers and attaches them to a GitHub release.
# Trigger: run `npm run release` locally, which bumps the version, commits, and pushes a v* tag.
# Signing uses Azure Artifact (formerly Trusted) Signing via src-tauri/tauri.signing.conf.json; local builds stay unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked

      - name: Install dependencies
        run: npm ci

      - name: Build and sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npm run tauri build -- --config src-tauri/tauri.signing.conf.json

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(
            "src-tauri/target/release/eventvideotool-app.exe"
            "src-tauri/target/release/ffmpeg.exe"
            "src-tauri/target/release/ffprobe.exe"
          ) + (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/nsis/*.exe).FullName
          $bad = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$($sig.Status)  $f  ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { $bad = $true }
          }
          if ($bad) { Write-Warning "Some files are not signed (see above)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
