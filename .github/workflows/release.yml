# Builds signed Windows installers and attaches them to a GitHub release, along
# with the latest.json manifest the in-app updater reads (endpoint in tauri.conf.json).
# Trigger: run `npm run release` locally, which bumps the version, commits, and pushes a v* tag.
# Signing uses Azure Artifact (formerly Trusted) Signing via src-tauri/tauri.signing.conf.json; local builds stay unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install artifact-signing-cli
        run: cargo install artifact-signing-cli --locked

      - name: Install dependencies
        run: npm ci

      - name: Build and sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Signs the updater artifacts (*.sig); the public half is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.signing.conf.json

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(
            "src-tauri/target/release/eventvideotool-app.exe"
            "src-tauri/target/release/ffmpeg.exe"
            "src-tauri/target/release/ffprobe.exe"
          ) + (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/nsis/*.exe).FullName
          $bad = $false
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$($sig.Status)  $f  ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { $bad = $true }
          }
          if ($bad) { Write-Warning "Some files are not signed (see above)" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

      # GitHub turns spaces in asset names into dots; rename up front so the
      # URLs in latest.json match the uploaded assets exactly.
      - name: Stage release assets and updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null

          function Stage($pattern) {
            $file = Get-Item $pattern
            if (@($file).Count -ne 1) { throw "Expected one file matching $pattern" }
            $name = $file.Name -replace ' ', '.'
            Copy-Item $file.FullName "release-assets/$name"
            @{ url = "$base/$name"; signature = (Get-Content "$($file.FullName).sig" -Raw).Trim() }
          }
          $nsis = Stage "src-tauri/target/release/bundle/nsis/*-setup.exe"
          $msi = Stage "src-tauri/target/release/bundle/msi/*.msi"

          @{
            version = $version
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = $nsis
              "windows-x86_64-nsis" = $nsis
              "windows-x86_64-msi" = $msi
            }
          } | ConvertTo-Json -Depth 4 | Set-Content release-assets/latest.json -Encoding utf8NoBOM
          Get-Content release-assets/latest.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release-assets/*

  cleanup:
    runs-on: ubuntu-latest
    needs: windows  # Only after a successful release, so a failed run can still be inspected from the artifacts
    # Manual (workflow_dispatch) runs don't publish a release; the artifact is their only output, so keep it.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: write

    steps:
      # The installers are attached to the GitHub release; delete the duplicate artifacts now rather than waiting for retention to expire
      - name: Delete workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[].id' \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
